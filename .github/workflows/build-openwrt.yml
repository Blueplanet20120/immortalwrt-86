name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
#   watch:
#     types: started
    
  #schedule:
     #- cron: 00 22 * * *
    
env:
  REPO_URL: --single-branch --filter=blob:none https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .diffconfig
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      actions: write
      contents: write
      attestations: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false  # 强制保留交换空间，防止多线程编译时内存(OOM)溢出

    - name: Check free space
      run: |
        echo "Free space after cleanup:"
        df -hT

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        mkdir -p openwrt/dl

    # 在 mv .diffconfig 之前记下 key，否则 prune 时 hashFiles 为空会把 dl 缓存删光
    - name: Set dl cache key
      run: echo "DL_CACHE_KEY=openwrt-dl-${{ hashFiles('.diffconfig', 'diffconfig.txt') }}" >> "$GITHUB_ENV"

    - name: Cache dl
      uses: actions/cache@v5
      with:
        path: openwrt/dl
        key: ${{ env.DL_CACHE_KEY }}
        restore-keys: |
          openwrt-dl-

    - name: Cache
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        clean: 'false'
        prefix: ${{ github.workspace }}/openwrt
    
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
    
    - name: romupdate2
      run: |
        cd openwrt/package
        git clone --depth 1 https://github.com/Blueplanet20120/romupdate2.git
        
    - name: lenyu
      run: |
        cd openwrt
        bash $GITHUB_WORKSPACE/lenyu.sh

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        echo -e 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y' >> .config
        
        # ☢️ 终极必杀技：专门对付 Host 架构的硬编码流氓判定
        # 锁定带有 download-ci-llvm 的行，把里面的 true 全部干掉换成 false！
        # 无论源码怎么变，它的判定逻辑最终都会变成 (...,false,false)，彻底断绝下载行为。
        if [ -f feeds/packages/lang/rust/Makefile ]; then
          sed -i '/download-ci-llvm/ s/true/false/g' feeds/packages/lang/rust/Makefile
        fi

        # gettext-full host：BISON_LOCALEDIR 宏被剥引号会在 '/' 处语法错误
        GETTEXT_MK="package/libs/gettext-full/Makefile"
        if [ -f "$GETTEXT_MK" ]; then
          sed -i '/BISON_LOCALEDIR/d' "$GETTEXT_MK"
          echo 'HOST_CFLAGS += -DBISON_LOCALEDIR=\"/usr/share/locale\"' >> "$GETTEXT_MK"
          echo 'TARGET_CFLAGS += -DBISON_LOCALEDIR=\"/usr/share/locale\"' >> "$GETTEXT_MK"
        fi
        rm -rf build_dir/hostpkg/gettext-*
        rm -rf build_dir/target-*/gettext-*
        rm -f staging_dir/host/share/aclocal/bison-i18n.m4

        make defconfig

        # defconfig 后再锁一次，避免依赖把 shadowsocks-rust 拉回来（Rust/LLVM 极慢）
        disable_pkg() {
          local k="$1"
          sed -i "s/^CONFIG_${k}=y/# CONFIG_${k} is not set/" .config || true
          grep -q "^# CONFIG_${k} is not set" .config || echo "# CONFIG_${k} is not set" >> .config
        }
        disable_pkg PACKAGE_shadowsocks-rust
        disable_pkg PACKAGE_shadowsocks-rust-sslocal
        disable_pkg PACKAGE_shadowsocks-rust-ssserver
        disable_pkg PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client
        disable_pkg PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server
        disable_pkg PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Rust_Client
        disable_pkg PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Rust_Server

        make download -j$(nproc)
        # 只删下载失败的残片，保留 .hash/.sha256 等本来就很小的校验文件
        find dl -type f -size -1024c ! -name '*.hash' ! -name '*.sha256*' ! -name '*.md5' -ls -delete || true

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        export GOPROXY=https://proxy.golang.org,direct
        export GOSUMDB=sum.golang.org
        set +e
        make -j$(nproc) 2>&1 | tee ../build-pass1.log
        rc=${PIPESTATUS[0]}
        set -e
        if [ "$rc" -ne 0 ]; then
          echo "===== first pass failed packages ====="
          grep -E 'ERROR: package|failed to build' ../build-pass1.log | tail -50 || true
          set +e
          make -j$(nproc) V=s 2>&1 | tee ../build-pass2.log
          rc2=${PIPESTATUS[0]}
          set -e
          echo "===== retry V=s failed packages ====="
          grep -E 'ERROR: package|failed to build' ../build-pass2.log | tail -50 || true
          exit "$rc2"
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v6
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
   
    - name: delete files
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        bash $GITHUB_WORKSPACE/rename.sh
    
    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v6
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Upload firmware to cowtransfer
      id: cowtransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
        echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: Upload firmware to WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
        echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        [ -f openwrt/wget/op_version1 ] && echo "release_tag=$(cat openwrt/wget/op_version1)" >> $GITHUB_OUTPUT || echo "release_tag=ImmortalWrt_${{ env.FILE_DATE }}" >> $GITHUB_OUTPUT
        git -C openwrt log --pretty=format:"%s(#By %an)" --graph --since=3.hour | sed '/^$/d' >> release.txt
        git -C openwrt/feeds/packages log --pretty=format:"%s(#By %an)" --graph --since=3.hour | sed '/^$/d' >> release.txt || true
        git -C openwrt/feeds/luci log --pretty=format:"%s(#By %an)" --graph --since=3.hour | sed '/^$/d' >> release.txt || true
        git -C openwrt/feeds/routing log --pretty=format:"%s(#By %an)" --graph --since=3.hour | sed '/^$/d' >> release.txt || true
        git -C openwrt/feeds/telephony log --pretty=format:"%s(#By %an)" --graph --since=3.hour | sed '/^$/d' >> release.txt || true
        git -C openwrt/feeds/helloworld log --pretty=format:"%s(#By %an)" --graph --since=8.hour | sed '/^$/d' >> release.txt || true
        git -C openwrt/feeds/passwall log --pretty=format:"%s(#By %an)" --graph --since=8.hour | sed '/^$/d' >> release.txt || true
        test  ! -s release.txt && echo -e "\n* The source code is not updated." >> release.txt
        sed -i '1i ## Firmware Update Log' release.txt
        [ "$UPLOAD_COWTRANSFER" == "true" ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ "$UPLOAD_WETRANSFER" == "true" ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.op_update }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        prerelease: true

    # cachewrtbuild 的 post 会在本步之后再写入一条新缓存，所以这里必须删光旧的，结束后才只剩 1 份。
    # dl 的 key 用开头记下的 DL_CACHE_KEY（不能在这里再 hashFiles，.diffconfig 已被 mv 走）。
    - name: Prune old Actions caches
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REPO="${{ github.repository }}"
        DATA=$(gh cache list -R "$REPO" --limit 100 --json id,key,createdAt)
        echo "$DATA" | jq -r '.[] | "\(.createdAt) \(.id) \(.key)"'

        delete_ids=$(echo "$DATA" | jq -r --arg dl "${DL_CACHE_KEY:-}" '
          ( [.[] | select(.key | startswith("cache-openwrt"))] | map(.id) )
          +
          ( [.[] | select((.key | startswith("openwrt-dl-")) and .key != $dl)] | map(.id) )
          +
          ( [.[] | select(.key | startswith("HEAD-"))] | sort_by(.createdAt) | reverse | .[2:] | map(.id) )
          | .[]
        ')
        for id in $delete_ids; do
          echo "Deleting cache id=$id"
          gh cache delete "$id" -R "$REPO" || true
        done

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 2
        keep_minimum_runs: 10

    - name: Remove old Releases
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.op_update }}
      run: |
        set -euo pipefail
        REPO="${{ github.repository }}"
        KEEP=10
        i=0
        while IFS= read -r tag; do
          if [ "$i" -ge "$KEEP" ]; then
            echo "Deleting release (and tag): $tag"
            gh release delete "$tag" --yes --cleanup-tag -R "$REPO" || true
          fi
          i=$((i + 1))
        done < <(gh api "repos/${REPO}/releases" --paginate --jq '.[] | .tag_name')
